[project]
name = "python-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gaurav", email = "gaurav.intouch@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-docx>=0.2.4",
    "pypdf2>=3.0.1",
    "langchain-text-splitters>=1.1.2",
    "langchain-core>=1.6.6",
    "pydantic>=2.13.5",
    "langchain-chroma>=1.1.0",
    "langchain-google-genai>=4.4.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
python-rag = "python_rag:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
