[project]
name = "python-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gaurav", email = "gaurav.intouch@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-docx>=0.2.4",
    "langchain-text-splitters>=1.1.2",
    "langchain-core>=1.6.6",
    "pydantic>=2.13.5",
    "langchain-chroma>=1.1.0",
    "python-dotenv>=1.2.3",
    "langchain-openai>=1.6.6",
    "pypdf>=6.19.0",
    "fastapi>=0.142.2",
]

[project.scripts]
python-rag = "python_rag:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "eval: LLM-judged quality evals; call OpenAI and cost money (run with: pytest -m eval)",
]
# Plain `pytest` runs only the free, offline tests; `pytest -m eval` overrides this.
addopts = "-m 'not eval'"
